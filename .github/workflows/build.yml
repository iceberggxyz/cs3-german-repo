name: Build and deploy plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Der Runner bringt das Android SDK bereits mit. Die Action
      # `android-actions/setup-android@v3` scheiterte hier reproduzierbar
      # (auch bei den Laeufen 7776a65 und 24d7150), deshalb wird nur noch
      # geprueft und exportiert, statt ein zweites SDK zu installieren.
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK nicht gefunden: $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK: $SDK"
          ls "$SDK/platforms" 2>/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null || true

      # Cache fuer Gradle-Wrapper und Abhaengigkeiten - kuerzt die Laufzeit deutlich.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --rerun-tasks ist Pflicht: ohne das haelt Gradle die make-Tasks fuer
      # aktuell, obwohl sich nur Metadaten (description/status) geaendert haben.
      - name: Build plugins and plugin list
        run: ./gradlew make makePluginsJson --rerun-tasks --no-daemon

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp */build/*.cs3 dist/
          cp build/plugins.json dist/
          ls -l dist

      # Schutz gegen die Fehlerklasse "plugins.json zeigt auf alten Stand":
      # CloudStream bricht mit "Extension hash mismatch" ab, wenn fileHash nicht
      # zur ausgelieferten .cs3 passt. Hier faellt das VOR dem Push auf.
      - name: Verify hashes
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          dist = pathlib.Path("dist")
          plugins = json.loads((dist / "plugins.json").read_text(encoding="utf-8"))

          errors = []
          for plugin in plugins:
              name = plugin.get("internalName") or plugin.get("name")
              expected = plugin.get("fileHash") or ""
              target = dist / f"{name}.cs3"
              if not target.exists():
                  errors.append(f"{name}: Datei fehlt ({target})")
                  continue
              digest = "sha256-" + hashlib.sha256(target.read_bytes()).hexdigest()
              print(f"{target.name}: {digest[:23]}... version={plugin.get('version')}")
              if digest != expected:
                  errors.append(f"{name}: fileHash={expected} != {digest}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"\nAlle {len(plugins)} Hashes stimmen.")
          PY

      # .cs3 und plugins.json landen im SELBEN Commit. CloudStream prueft beim
      # Download den in plugins.json hinterlegten SHA-256; getrennte Commits
      # fuehren zu "Extension hash mismatch".
      - name: Publish to builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds

      - name: Summary
        run: |
          echo "### Ausgelieferte Artefakte" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
