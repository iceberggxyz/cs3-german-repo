name: Build and deploy plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --rerun-tasks ist Pflicht: ohne das haelt Gradle die make-Tasks fuer
      # aktuell, obwohl sich nur Metadaten (description/status) geaendert haben.
      - name: Build plugins and plugin list
        run: ./gradlew make makePluginsJson --rerun-tasks --no-daemon

      - name: Collect artefacts
        run: |
          mkdir -p dist
          cp */build/*.cs3 dist/
          cp build/plugins.json dist/
          ls -l dist

      # .cs3 und plugins.json landen im SELBEN Commit. CloudStream prueft beim
      # Download den in plugins.json hinterlegten SHA-256; getrennte Commits
      # fuehren zu "Extension hash mismatch".
      - name: Publish to builds branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q
          git checkout -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds

      - name: Summary
        run: |
          echo "### Ausgelieferte Artefakte" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -l dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
